name: app-dev
services:
  postgres:
    image: postgres:15
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: dev
    volumes:
      - ../backend:/app/backend
      - ../shared:/app/shared
      - /app/backend/node_modules
    ports:
      - '5001:3000'
    depends_on:
      - postgres
    # environment:
    #   - NODE_ENV=development
    # - DATABASE_URL=postgresql://postgres:postgres@postgres:5433/db
    environment:
      OCR_BASE_URL: http://ocr:8000
      OCR_TIMEOUT_MS: '90000'
    env_file:
      - ../backend/.env.development

  ocr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ocr
      target: ${OCR_PROVIDER:-doctr}
    environment:
      OCR_PRELOAD_MODELS: ${OCR_PRELOAD_MODELS:-true}
      OCR_LOG_WORD_SCORES: ${OCR_LOG_WORD_SCORES:-true}
      MALLOC_ARENA_MAX: '2'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TORCH_DEVICE: cpu
      RECOGNITION_BATCH_SIZE: '4'
      DETECTOR_BATCH_SIZE: '1'
    restart: always
    mem_limit: 1800m
    memswap_limit: 1800m
    expose:
      - '8000'
    volumes:
      - ocr_model_cache:/root/.cache

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: dev
    volumes:
      - ../frontend:/app/frontend
      - ../shared:/app/shared
      - /app/frontend/node_modules
    ports:
      - '8080:8080'
    command: npm run dev
volumes:
  postgres_data:
  ocr_model_cache:
