name: app-dev
services:
  postgres:
    image: postgres:15
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: dev
    volumes:
      - ../backend:/app/backend
      - ../shared:/app/shared
      - /app/backend/node_modules
    ports:
      - '5001:3000'
    depends_on:
      - postgres
    # environment:
    #   - NODE_ENV=development
    # - DATABASE_URL=postgresql://postgres:postgres@postgres:5433/db
    environment:
      OCR_BASE_URL: http://ocr:8000
      OCR_TIMEOUT_MS: '90000'
    env_file:
      - ../backend/.env.development
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend-local.rule=Host(`app.hokopi.local`) && PathPrefix(`/api`)
      - traefik.http.routers.backend-local.entrypoints=web
      - traefik.http.routers.backend-local.middlewares=backend-api-prefix-local
      - traefik.http.middlewares.backend-api-prefix-local.stripprefix.prefixes=/api
      - traefik.http.services.backend-local.loadbalancer.server.port=3000

  ocr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ocr
      target: ${OCR_PROVIDER:-doctr}
    environment:
      OCR_PRELOAD_MODELS: ${OCR_PRELOAD_MODELS:-true}
      OCR_LOG_WORD_SCORES: ${OCR_LOG_WORD_SCORES:-true}
      MALLOC_ARENA_MAX: '2'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TORCH_DEVICE: cpu
      RECOGNITION_BATCH_SIZE: '4'
      DETECTOR_BATCH_SIZE: '1'
    restart: always
    mem_limit: 1800m
    memswap_limit: 1800m
    expose:
      - '8000'
    volumes:
      - ocr_model_cache:/root/.cache

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webapp
      target: dev
    volumes:
      - ../frontend:/app/frontend
      - ../shared:/app/shared
      - /app/frontend/node_modules
    ports:
      - '8080:8080'
    command: npm run dev

    labels:
      - traefik.enable=true
      - traefik.http.routers.webapp-local.rule=Host(`app.hokopi.local`)
      - traefik.http.routers.webapp-local.entrypoints=web
      - traefik.http.services.webapp-local.loadbalancer.server.port=8080

  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile.website
      target: dev
    volumes:
      - ../website:/app/website
      - ../shared:/app/shared
      - /app/website/node_modules
    command: npm run dev -- --host 0.0.0.0
    labels:
      - traefik.enable=true
      - traefik.http.routers.website-local.rule=Host(`hokopi.local`)
      - traefik.http.routers.website-local.entrypoints=web
      - traefik.http.services.website-local.loadbalancer.server.port=8081

  traefik:
    image: traefik:3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  ocr_model_cache:
