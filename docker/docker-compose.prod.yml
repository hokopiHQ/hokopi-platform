name: app

services:
  postgres:
    image: postgres:15
    restart: always
    ports:
      - '127.0.0.1:5432:5432' # Expose PostgreSQL only on localhost
    env_file:
      - ../backend/.env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SECURITY TEST
    user: '999:999'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/run/postgresql:rw,noexec,nosuid
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]

  backend:
    build:
      context: .. # Le contexte est la racine du dépôt (/var/www/mon-app)
      dockerfile: docker/Dockerfile.backend # Chemin relatif depuis le contexte
      target: prod # Utilise l'étape 'prod' de Dockerfile.backend
    depends_on:
      - postgres
    env_file:
      - ../backend/.env.production
    environment:
      OCR_BASE_URL: http://ocr:8000
      OCR_TIMEOUT_MS: '90000'
    restart: always

  ocr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ocr
      target: ${OCR_PROVIDER:-doctr}
    environment:
      OCR_PRELOAD_MODELS: ${OCR_PRELOAD_MODELS:-true}
      OCR_LOG_WORD_SCORES: ${OCR_LOG_WORD_SCORES:-false}
      MALLOC_ARENA_MAX: '2'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TORCH_DEVICE: cpu
      RECOGNITION_BATCH_SIZE: '4'
      DETECTOR_BATCH_SIZE: '1'
    restart: always
    mem_limit: 1800m
    memswap_limit: 1800m
    expose:
      - '8000'
    volumes:
      - ocr_model_cache:/root/.cache

  frontend:
    build:
      context: .. # Le contexte est la racine du dépôt (/var/www/mon-app)
      dockerfile: docker/Dockerfile.frontend # Chemin relatif depuis le contexte
      target: prod # Utilise l'étape 'prod' de Dockerfile.frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    depends_on:
      - backend

volumes:
  pgdata:
  ocr_model_cache:
