name: Delivery

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sca:
    name: Security >> Dependencies (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scan dependency vulnerabilities
        uses: ./.github/actions/dependencyScan
