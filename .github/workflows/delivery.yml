name: Delivery

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # DELIVERY ---------------------
  sca:
    name: Security >> Dependencies (audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scan dependency vulnerabilities
        uses: ./.github/actions/dependencyScan

  backend-image:
    name: Build backend image
    needs: sca
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/hokopihq/hokopi-backend
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build image
        run: |
          docker build \
            --file docker/Dockerfile.backend \
            --target prod \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: List built image
        run: |
          docker image ls "$IMAGE" --digests
          docker image inspect "$IMAGE:$TAG" \
            --format 'id={{ .Id }} created={{ .Created }}'

      - name: Scan image vulnerabilities
        uses: ./.github/actions/scanDockerImage
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  webapp-image:
    name: Build webapp image
    needs: sca
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/hokopihq/hokopi-webapp
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build image
        run: |
          docker build \
            --file docker/Dockerfile.webapp \
            --target prod \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: List built image
        run: |
          docker image ls "$IMAGE" --digests
          docker image inspect "$IMAGE:$TAG" \
            --format 'id={{ .Id }} created={{ .Created }}'

      - name: Scan image vulnerabilities
        uses: ./.github/actions/scanDockerImage
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
