name: Temporary
run-name: 'Temporary'

on:
  workflow_dispatch:
    inputs:
      check:
        description: Check to execute
        type: choice
        options:
          - none
          - info
        required: true
        default: none

permissions:
  contents: read
  packages: read

jobs:
  temporary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check runner info
        if: inputs.check == 'info'
        run: |
          uname -a
          docker --version
          ssh -V
          jq --version

      - uses: ./.github/actions/detectChanges
        id: changes

      - name: Display detected changes
        run: |
          echo "backend = ${{steps.changes.outputs.backend}}"
          echo "webapp = ${{steps.changes.outputs.webapp}}"

      - name: Scan dependency vulnerabilities
        uses: ./.github/actions/dependencyScan
