name: Temporary
run-name: 'Temporary · ${{ inputs.label }} · ${{ inputs.check }}'

on:
  workflow_dispatch:
    inputs:
      label:
        description: Description of this temporary run
        type: string
        required: true
      check:
        description: Check to execute
        type: choice
        options:
          - test
        required: true

permissions:
  contents: read

jobs:
  temporary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check runner test
        if: inputs.check == 'test'
        run: |
          uname -a
          docker --version
          ssh -V
          jq --version
