name: Publish Platform Mirror

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-platform:
    name: Publish Platform Mirror
    runs-on: ubuntu-latest
    steps:
      - name: Authorize source branch
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          case "$SOURCE_BRANCH" in
            main|develop)
              echo "Authorized source: $SOURCE_BRANCH"
              ;;
            *)
              echo "::error::Unauthorized source branch: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setupGitleaks

      - name: Install git-filter-repo
        run: pipx install git-filter-repo

      - name: Prepare Platform mirror
        run: bash ops/publish-platform-mirror.sh prepare

      - name: Generate Platform Publisher token
        id: platform-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GHAPP_PLATFORM_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.GHAPP_PLATFORM_PUBLISHER_PRIVATE_KEY }}
          owner: hokopiHQ
          repositories: hokopi-platform

      - name: Publish Platform mirror
        env:
          PLATFORM_TOKEN: ${{ steps.platform-token.outputs.token }}
        run: bash ops/publish-platform-mirror.sh publish
