name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: read

jobs:
  secret-scan:
    name: Security >> Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setupGitleaks

      - name: Scan Secrets
        run: gitleaks git --redact --verbose

  sast:
    name: Security >> SAST (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST - Semgrep
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            ghcr.io/hokopihq/semgrep:1.178.0-nonroot \
            semgrep scan \
              --config auto \
              --error \
              /src

  backend:
    name: Quality >> Backend
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation
        working-directory: backend
        run: npm ci

      - name: Generate Prisma clients
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hokopi
        run: npx prisma generate

      - name: Lint
        continue-on-error: true
        working-directory: backend
        run: npm run lint

      - name: Test
        continue-on-error: true
        working-directory: backend
        run: npm run test

      - name: Build
        working-directory: backend
        run: npm run build

  webapp:
    name: Quality >> Webapp
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            webapp/package-lock.json

      - name: Install Prisma generator dependencies
        working-directory: backend
        run: npm ci

      - name: Generate shared Prisma models
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hokopi
        run: npx prisma generate --generator shared

      - name: Installation
        working-directory: webapp
        run: npm ci

      - name: Lint
        continue-on-error: true
        working-directory: webapp
        run: npm run lint

      - name: Build
        working-directory: webapp
        run: npm run build
