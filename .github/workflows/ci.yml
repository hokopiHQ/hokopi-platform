name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setupGitleaks

      - name: Scan Secrets
        run: gitleaks git --redact --verbose

  backend:
    name: Backend Quality
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installation
        working-directory: backend
        run: npm ci

      - name: Generate Prisma clients
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hokopi
        run: npx prisma generate

      - name: Lint
        continue-on-error: true
        working-directory: backend
        run: npm run lint

      - name: Test
        continue-on-error: true
        working-directory: backend
        run: npm run test

      - name: Build
        working-directory: backend
        run: npm run build

  webapp:
    name: Webapp Quality
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            webapp/package-lock.json

      - name: Install Prisma generator dependencies
        working-directory: backend
        run: npm ci

      - name: Generate shared Prisma models
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hokopi
        run: npx prisma generate --generator shared

      - name: Installation
        working-directory: webapp
        run: npm ci

      - name: Lint
        continue-on-error: true
        working-directory: webapp
        run: npm run lint

      - name: Build
        working-directory: webapp
        run: npm run build
