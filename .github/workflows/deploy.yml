name: Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    env:
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_SERVER: ${{ vars.SSH_SERVER }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
      BRANCH: ${{ vars.GITHUB_REF_NAME || github.ref_name }}
      WEBSITE_NOINDEX: ${{ vars.WEBSITE_NOINDEX || 'true' }}
      WEBSITE_URL: ${{ vars.WEBSITE_URL || (github.ref == 'refs/heads/main' && 'https://hokopi.com' || 'https://beta.hokopi.com') }}
      # Backup Config
      BACKUP_USER: ${{ vars.BACKUP_USER }}
      BACKUP_SERVER: ${{ vars.BACKUP_SERVER }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS || '30' }}
      BACKUP_RETENTION_WEEKS: ${{ vars.BACKUP_RETENTION_WEEKS || '52' }}
      BACKUP_RETENTION_MONTHS: ${{ vars.BACKUP_RETENTION_MONTHS || '60' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install ssh client
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y openssh-client
          else
            apt-get update && apt-get install -y openssh-client
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa -p 22 -H $SSH_SERVER > ~/.ssh/known_hosts

      - name: Deploy to ${{ env.ENVIRONMENT }} - branch ${{ env.BRANCH }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -i ~/.ssh/id_rsa \
              $SSH_USER@$SSH_SERVER "BRANCH=${{ env.BRANCH }} bash -s" <<'EOF'
          set -e

          cd /var/www/app
          if [ ! -d .git ]; then
            echo "📥 First installation - cloning repository"
            git clone git@github.com:hokopiHQ/hokopi-webapp.git .
          fi
          git fetch origin
          git checkout -f "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git clean -fdx

          echo "📦 Generating backend/.env.production"
          cat <<EOT > backend/.env.production
          NODE_ENV=production
          JWT_SECRET=${{ secrets.BACKEND_JWT_SECRET }}
          DATABASE_URL=${{ secrets.BACKEND_DATABASE_URL }}
          POSTGRES_USER=${{ secrets.BACKEND_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.BACKEND_POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.BACKEND_POSTGRES_DB }}
          MAIL_ENABLED=${{ vars.BACKEND_MAIL_ENABLED || 'false' }}
          APP_URL=${{ vars.APP_URL }}
          MAIL_FROM=${{ vars.BACKEND_MAIL_FROM }}
          MAIL_REPLYTO=${{ vars.BACKEND_MAIL_REPLYTO }}
          RESEND_API_KEY=${{ secrets.BACKEND_RESEND_API_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.BACKEND_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.BACKEND_STRIPE_WEBHOOK_SECRET }}
          EOT

          echo "🌐 Generating frontend/.env.production"
          cat <<EOT > frontend/.env.production
          VITE_API_URL=/api
          VITE_ENV=${{ env.ENVIRONMENT }}
          VITE_STRIPE_PUBLIC_KEY=${{ vars.FRONTEND_STRIPE_PUBLIC_KEY }}
          EOT

          echo "🌍 Generating website/.env.production"
          cat <<EOT > website/.env.production
          PUBLIC_APP_URL=${{ vars.APP_URL }}
          PUBLIC_SITE_URL=${{ env.WEBSITE_URL }}
          PUBLIC_NOINDEX=${{ env.WEBSITE_NOINDEX }}
          EOT

          echo "📝 Generating ops/.env..."
          cat <<EOT > ops/.env
          BACKUP_USER=${{ vars.BACKUP_USER }}
          BACKUP_SERVER=${{ vars.BACKUP_SERVER }}
          REMOTE_BASE_DIR=/${{ env.ENVIRONMENT }}
          RESTIC_PASSWORD=${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REPOSITORY=sftp://${{ vars.BACKUP_USER }}@${{ vars.BACKUP_SERVER }}:23/${{ env.ENVIRONMENT }}/restic-repo
          BACKUP_RETENTION_DAYS=${{ vars.BACKUP_RETENTION_DAYS || '30' }}
          BACKUP_RETENTION_WEEKS=${{ vars.BACKUP_RETENTION_WEEKS || '52' }}
          BACKUP_RETENTION_MONTHS=${{ vars.BACKUP_RETENTION_MONTHS || '60' }}
          EOT

          chmod +x ops/backup.sh

          echo "⏰ Updating Crontab..."
          crontab ops/crontab

          echo "🕒 Ensuring PostgreSQL is available for backup"
          sudo docker compose -f docker/docker-compose.prod.yml up -d postgres

          POSTGRES_CONTAINER=$(sudo docker compose -f docker/docker-compose.prod.yml ps -q postgres)
          if [ -z "$POSTGRES_CONTAINER" ]; then
            echo "::error::❌ PostgreSQL container is not available for backup"
            exit 1
          fi

          RETRIES=10
          until sudo docker exec $POSTGRES_CONTAINER pg_isready -U ${{ secrets.BACKEND_POSTGRES_USER }} || [ $RETRIES -eq 0 ]; do
            echo "⏳ Waiting PostgreSQL before backup..."
            sleep 2
            ((RETRIES--))
          done

          if [ $RETRIES -eq 0 ]; then
            echo "::error::❌ PostgreSQL is not ready for backup"
            exit 1
          fi

          echo "💾 Running Pre-deployment Backup..."
          if ./ops/backup.sh; then
            echo "::notice::✅ Backup successful"
          else
            echo "::error::⚠️ Backup failed!"
            exit 1
          fi

          echo "🚀 Docker Compose build & restart"

          sudo docker compose -f docker/docker-compose.prod.yml down
          sudo docker compose -f docker/docker-compose.prod.yml up --build -d

          sleep 5

          POSTGRES_CONTAINER=$(sudo docker compose -f docker/docker-compose.prod.yml ps -q postgres) 
          BACKEND_CONTAINER=$(sudo docker compose -f docker/docker-compose.prod.yml ps -q backend)                                 

          echo "🕒 Waiting PostgreSQL (20s max)"
          RETRIES=10
          until sudo docker exec $POSTGRES_CONTAINER pg_isready -U ${{ secrets.BACKEND_POSTGRES_USER }} || [ $RETRIES -eq 0 ]; do
            echo "⏳ ..."
            sleep 2
            ((RETRIES--))
          done

          if [ $RETRIES -eq 0 ]; then
            echo "❌ PostgreSQL is not ready. Cancel!"
            exit 1
          fi

          echo "🔁 Prisma Migrate Deploy"
          sudo docker exec $BACKEND_CONTAINER npx prisma migrate deploy

          echo "🌱 Seed initial data (Units, etc.)"
          sudo docker exec $BACKEND_CONTAINER npm run seed

          echo "🧰 Docker Cleanup"
          echo "-- BuildKit Cache"
          sudo docker builder prune -f --filter until=24h

          echo "-- Unused Images"
          sudo docker image prune -f --filter until=24h --filter label!=keep

          echo "📊 Available Storage"
          df -m

          echo "✅ The End !!"
          EOF
