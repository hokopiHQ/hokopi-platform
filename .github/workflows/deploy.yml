name: Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  vm:
    runs-on: ubuntu-latest
    container: ubuntu:latest

    env:
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_SERVER: ${{ vars.SSH_SERVER }}
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
      BRANCH: ${{ vars.GITHUB_REF_NAME || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ssh client
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y openssh-client
          else
            apt-get update && apt-get install -y openssh-client
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_SERVER" >> ~/.ssh/known_hosts

      - name: Deploy to ${{ env.ENVIRONMENT }} - branch ${{ env.BRANCH }}
        run: |
          ssh $SSH_USER@$SSH_SERVER <<'EOF'
          set -e

          cd /var/www/app
          if [ ! -d .git ]; then
            echo "📥 Première installation - clonage du dépôt"
            git clone git@github.com:badelgeek/chefpocket.git .
          fi
          git fetch origin
          git checkout $BRANCH
          git pull origin $BRANCH

          echo "📦 Génération backend/.env.production"
          cat <<EOT > backend/.env.production
          NODE_ENV=production
          JWT_SECRET=${{ secrets.BACKEND_JWT_SECRET }}
          DATABASE_URL=${{ secrets.BACKEND_DATABASE_URL }}
          POSTGRES_USER=${{ secrets.BACKEND_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.BACKEND_POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.BACKEND_POSTGRES_DB }}
          EOT

          echo "🌐 Génération frontend/.env.production"
          cat <<EOT > frontend/.env.production
          VITE_API_URL=/api
          EOT

          echo "🚀 Docker Compose build & restart"
          docker compose -f docker/docker-compose.prod.yml down
          docker compose -f docker/docker-compose.prod.yml up --build -d

          POSTGRES_CONTAINER=$(docker compose -f docker/docker-compose.prod.yml ps -q postgres) 
          BACKEND_CONTAINER=$(docker compose -f docker/docker-compose.prod.yml ps -q backend)                                 

          echo "🕒 Waiting PostgreSQL (20s max)"
          RETRIES=10
          until docker exec $POSTGRES_CONTAINER pg_isready -U ${{ secrets.BACKEND_POSTGRES_USER }} || [ $RETRIES -eq 0 ]; do
            echo "⏳ ..."
            sleep 2
            ((RETRIES--))
          done

          if [ $RETRIES -eq 0 ]; then
            echo "❌ PostgreSQL is not ready. Cancel!"
            exit 1
          fi

          echo "🔁 Prisma Migrate Deploy"
          docker exec $BACKEND_CONTAINER npx prisma migrate deploy

          echo "🌱 Seed initial data (Units, etc.)"
          docker exec $BACKEND_CONTAINER npx --yes tsx prisma/seed/seed.ts

          echo "✅ Déploiement $ENVIRONMENT terminé sur la branche $BRANCH"
          EOF
